services:
  caddy:
    image: caddy:2-alpine
    # 8090, not 80: ports 80/3000/8080 are already taken on kla-server.
    # The Cloudflare Tunnel (host network) reaches this at localhost:8090.
    ports:
      - "8090:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    image: ghcr.io/naphatnu/omnidiagram-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    restart: unless-stopped

  backend:
    image: ghcr.io/naphatnu/omnidiagram-backend:${IMAGE_TAG:-latest}
    build: ./backend
    environment:
      FRONTEND_INTERNAL_URL: http://frontend:3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MCP_API_KEY: ${MCP_API_KEY}
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
